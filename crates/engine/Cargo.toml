[package]
name = "hachi-engine"
version = "0.1.0"
description = "The rules engine for 893 Hold'em: cards, hand evaluation, odds, the night state machine, bots, and per-seat views."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

# The bench loops as a WebAssembly module; see examples/wasm_bench.rs.
[[example]]
name = "wasm_bench"
crate-type = ["cdylib"]
