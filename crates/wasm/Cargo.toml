[package]
name = "hachi-wasm"
version = "0.1.0"
description = "WebAssembly bindings for the 893 Hold'em engine, shared by the rooms Worker, the browser, and the tests."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hachi-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
