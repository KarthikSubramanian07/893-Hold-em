name: Deploy

# On every push to main: build the wasm engine, deploy the rooms Worker, then
# the Pages site. Runs only when a CLOUDFLARE_API_TOKEN secret is set (with
# Workers Scripts and Pages edit permissions) plus CLOUDFLARE_ACCOUNT_ID, so the
# repo stays green before deploys are wired up. Locally, `bun run deploy` does
# the same with your own wrangler login.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.CF_TOKEN != '' }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ env.CF_TOKEN != '' }}
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: ${{ env.CF_TOKEN != '' }}
      - name: Install wasm-pack
        if: ${{ env.CF_TOKEN != '' }}
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - uses: actions/setup-node@v4
        if: ${{ env.CF_TOKEN != '' }}
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        if: ${{ env.CF_TOKEN != '' }}
      - if: ${{ env.CF_TOKEN != '' }}
        run: bun install --frozen-lockfile
      - name: Build
        if: ${{ env.CF_TOKEN != '' }}
        run: bun run build:wasm && bun run build
      - name: Deploy the rooms Worker
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config worker/wrangler.jsonc
      - name: Deploy the Pages site
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name holdem893 --branch main
